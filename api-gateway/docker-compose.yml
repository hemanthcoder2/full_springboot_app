version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: .
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      FRONTEND_URL: http://localhost:3000

      # Downstream service URLs
      AUTH_SERVICE_URL:     http://auth-service:8081
      COMPANY_SERVICE_URL:  http://company-service:8082
      EMPLOYEE_SERVICE_URL: http://employee-service:8083
      TEAM_SERVICE_URL:     http://team-service:8084
      DASHBOARD_SERVICE_URL: http://dashboard-service:8085
      ROLE_SERVICE_URL:     http://role-service:8086
      PRICING_SERVICE_URL:  http://pricing-service:8087

volumes:
  redis_data:
