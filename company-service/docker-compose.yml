version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: company-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: company_db
    ports:
      - "3306:3306"
    volumes:
      - company_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  company-service:
    build: .
    container_name: company-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/company_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      AUTH_SERVICE_URL:    http://auth-service:8081
      PRICING_SERVICE_URL: http://pricing-service:8087

volumes:
  company_mysql_data:
