server:
  port: 8082

spring:
  application:
    name: company-service

  datasource:
    url: jdbc:mysql://localhost:3306/company_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Internal service URLs (called via RestTemplate, not through gateway)
services:
  auth-url:    ${AUTH_SERVICE_URL:http://localhost:8081}
  pricing-url: ${PRICING_SERVICE_URL:http://localhost:8087}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.yourapp.company: DEBUG
